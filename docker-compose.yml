# LLM Second Brain — self-hosted MCP-сервер долговременной памяти (NFR-1).
#
# ПОЛНАЯ конфигурация запуска живёт здесь (решение О. 2026-08-29: без .env).
# Перед первым запуском заполнить четыре обязательных значения ниже
# (MCP_AUTH_TOKEN сгенерируй: openssl rand -hex 32) — пустой токен или
# недоступная Ollama не пройдут стартовые проверки конфигурации.
# Каталог данных: mkdir -p data.

services:
  second-brain:
    build: .
    image: llm-second-brain:latest
    container_name: llm-second-brain  # явное имя вместо сгенерированного
    restart: unless-stopped
    ports:
      - "8080:8080"  # host:container
    environment:
      # --- обязательные ---
      OLLAMA_BASE_URL: "http://192.168.3.113:11434"        # Ollama векторизации (/api/embed)
      SUMMARY_OLLAMA_BASE_URL: "http://192.168.3.112:11434" # Ollama суммаризации (/api/chat)
      SUMMARY_MODEL: "ornith-1.5:35b"                       # генеративная модель суммаризации
      MCP_AUTH_TOKEN: "b5e5085482a05119f193f4b064dd8e202dbd193056f14698241c4d4da6557f53"                  # Bearer-токен всех ручек, кроме /health
      # --- векторизация: все параметры эмбеддинга ---
      EMBEDDING_MODEL: "qwen3-embedding:8b"  # смена → автоматическая реиндексация БД при старте
      EMBEDDING_DIM: "4096"                  # размерность; фиксируется в БД (meta), смена → реиндексация
      # --- чанковая индексация (Фаза 7): вектора заметки — по чанкам ---
      TEXT_SPLITTER: "tiktoken"              # токен-сплиттер; encoding фикс: cl100k_base (кэш в образе)
      CHUNK_SIZE: "1024"                     # окно чанка, токенов; смена → пере-чанковка всех заметок
      CHUNK_OVERLAP: "180"                   # перекрытие соседних окон, токенов (< CHUNK_SIZE)
      CHUNK_MIN_TARGET: "200"                # хвостовой чанк меньше — слить с предыдущим
      EMBEDDING_BATCH_SIZE: "32"             # чанков в одном /api/embed запросе воркера
      EMBEDDING_CONCURRENT_REQUESTS: "1"     # сервер = одна генерация; очередь ollama_slot гарантирует это и кодом (F1, решение О. 2026-08-30)
      SCORE_THRESHOLD: "0.35"                # порог косинуса для отсечения в поиске
      DEDUP_SIMILARITY: "0.92"               # порог «дубль» в фоновом дедупе (Фаза 8)
      DEDUP_CANDIDATE_TOP_N: "3"             # топ-N косинус-кандидатов дедупа (Этап 2.1)
      DEDUP_CANDIDATE_SIMILARITY: "0.80"     # нижний порог кандидата-перефраза (≤ DEDUP_SIMILARITY)
      # --- суммаризация (режим «Б»: режимы think не ограничиваются) ---
      MAX_SUMMARY_CHARS: "200"
      SUMMARY_THINK: "true"                  # оставить размышления модели
      SUMMARY_NUM_PREDICT: "35000"           # потолок thinking+content выжимки (О. 2026-08-30: 1500→35000)
      MERGE_NUM_PREDICT: "35000"             # отдельный потолок слияния дублей (О. 2026-08-30)
      SUMMARY_TIMEOUT_SEC: "750"             # 12.5 мин (решение О. 2026-08-30: 600→750 под merge 35k-заметок); боевые суммари ~60 c
      # --- LLM-судья дедупа (Фаза 8, Этап 3, решение О. 2026-08-30: ornith-1.5:35b) ---
      DEDUP_JUDGE_OLLAMA_BASE_URL: "http://192.168.3.112:11434"  # Ollama судьи (/api/chat)
      DEDUP_JUDGE_MODEL: "ornith-1.5:35b"                        # модель-судья дедупа
      DEDUP_JUDGE_THINK: "true"              # думающий судья: think:false давал ложные ДУБЛИ на длинных заметках (E2E); решение О. 2026-08-30
      DEDUP_JUDGE_NUM_PREDICT: "1024"        # бюджет thinking+вердикт (замер: ~1200 токенов, done_reason=stop)
      DEDUP_JUDGE_TIMEOUT_SEC: "300"         # думающий судья: длинная пара 46 c, худший живой вызов ~121 c (E2E) — 300 с с запасом; решение О. 2026-08-30
      # --- HTTP/MCP ---
      PORT: "8080"
      MCP_PATH: "/mcp"
      # --- хранилище ---
      DB_PATH: "/data/notes.db"
      MAX_NOTE_CHARS: "35000"                # 2000→20000 (Фаза 7) → 35000 (решение О. 2026-08-30)
      PENDING_RETRY_SEC: "30"                # стартовый интервал фонового воркера (×2 → 15 мин)
      # --- поиск ---
      DEFAULT_TOP_K: "5"
      DEFAULT_LIST_LIMIT: "20"
      RRF_K: "60"
      MAX_QUERY_CHARS: "512"
      MAX_GET_BATCH: "20"
      SNIPPET_CHARS: "120"
      # --- прочее/наблюдаемость/backup ---
      AUTHOR_DEFAULT: "unknown"
      LOG_LEVEL: "INFO"
      BACKUP_DIR: "/data/backups"
      BACKUP_INTERVAL_SEC: "86400"
      BACKUP_KEEP: "7"
    volumes:
      - ./data:/data  # SQLite notes.db, снапшоты
    healthcheck:
      # python:3.12-slim не содержит curl — проверяем штатным python (NFR-4: /health без токена).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s