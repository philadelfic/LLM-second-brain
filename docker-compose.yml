# LLM Second Brain — self-hosted MCP server for LLM long-term memory (NFR-1).
#
# The FULL runtime configuration lives here (no .env).
# Before the first run fill in the required values below
# (generate MCP_AUTH_TOKEN: openssl rand -hex 32; keep the production token
# in docker-compose.override.yml — gitignored; the repo ships CHANGE_ME) —
# an empty token or unreachable LLM slots fail the startup checks.
# Data directory: mkdir -p data.
#
# Phase 11 (v2.1): three LLM slots (embedding / summary / judge) are
# configured independently — provider, API base URL, model and (optional)
# API key per slot. Provider: ollama (native API, default) | openai
# (OpenAI-compatible, Bearer).
#
# IMPORTANT: changing EMBEDDING_PROVIDER / EMBEDDING_MODEL / EMBEDDING_DIM
# triggers a FULL automatic reindex at startup: both vector indexes are
# rebuilt, ALL notes (including trash) go back to pending and the background
# worker re-encodes them. Search/dedup thresholds are calibrated for
# qwen3-embedding:8b — recalibrate after switching the embedding model.

services:
  second-brain:
    build: .
    image: llm-second-brain:latest
    container_name: llm-second-brain  # explicit name instead of generated
    restart: unless-stopped
    ports:
      - "8080:8080"  # host:container
    environment:
      # --- required ---
      MCP_AUTH_TOKEN: "CHANGE_ME"                  # Bearer token for all endpoints except /health; keep the production value in gitignored docker-compose.override.yml
      # --- embedding slot (vectorization) ---
      EMBEDDING_PROVIDER: "ollama"                 # ollama (default) | openai
      EMBEDDING_BASE_URL: "http://localhost:11434"  # ollama: /api/embed; openai: /v1/embeddings
      EMBEDDING_API_KEY: "CHANGE_ME"               # optional; required for the openai provider (otherwise 401/403 hint on call)
      EMBEDDING_MODEL: "qwen3-embedding:8b"  # change → automatic DB reindex at startup
      EMBEDDING_DIM: "4096"                  # dimension; fixed in DB (meta), change → reindex
      # --- summary slot (summarization + merge + classification + node description) ---
      SUMMARY_PROVIDER: "ollama"                 # ollama (default) | openai
      SUMMARY_BASE_URL: "http://localhost:11434"  # ollama: /api/chat; openai: /v1/chat/completions
      SUMMARY_API_KEY: "CHANGE_ME"               # optional; required for the openai provider
      SUMMARY_MODEL: "ornith:35b"                # summarization model
      SUMMARY_MODEL_TYPE: "generation"   # reasoning | generation; declare reasoning to get the budget and thinking guards
      # --- judge slot (dedup judge + structure judge) ---
      JUDGE_PROVIDER: "ollama"                 # ollama (default) | openai
      JUDGE_BASE_URL: "http://localhost:11434"  # ollama: /api/chat; openai: /v1/chat/completions
      JUDGE_API_KEY: "CHANGE_ME"               # optional; required for the openai provider
      JUDGE_MODEL: "ornith:35b"                # dedup judge model
      JUDGE_MODEL_TYPE: "generation"   # reasoning | generation; declare reasoning to get the budget and thinking guards
      JUDGE_THINK: "true"              # thinking judge: think:false produced false positives on long notes (E2E); ollama provider only
      JUDGE_NUM_PREDICT: "0"           # 0 = as much as fits (auto budget from JUDGE_CONTEXT_TOKENS); explicit values keep the old caps (1024)
      JUDGE_TIMEOUT_SEC: "300"         # thinking judge: long pair 46 s, worst live call ~121 s (E2E) — 300 s with margin; 900 = the back-off/pause ceiling (15 min): a single call must not hold the slot longer than the job cycle is willing to wait
      JUDGE_CONTEXT_TOKENS: "0"        # the model's context window; 0 = unknown → previous per-operation caps
      # --- decision slot (LSBN-F-12, 3.2.0): OFF by default; decisions go
      #     generative as today. decision needs Ollama ≥ 0.35.1: the route is
      #     native /v1/systemone, NOT OpenAI-compatible. When enabled, all
      #     questions of a group go in ONE call (up to DECISION_MAX_QUESTIONS).
      # DECISION_ENABLED: "false"           # true — enable the decision slot
      # DECISION_BASE_URL: "http://localhost:11434"  # /v1/systemone address (http(s); required when enabled)
      # DECISION_MODEL: "decision-model"    # decision model (required when enabled)
      # DECISION_API_KEY: ""                # optional; Bearer is sent only when set
      # DECISION_TIMEOUT_SEC: "300"         # no generation, but the prefill is long (pilot: up to 19 s per 2k tokens)
      # DECISION_THRESHOLD: "0.5"           # confidence threshold (0..1; a per-question value in the registry wins)
      # DECISION_UNCERTAINTY_ZONE: "0.05"   # half-width of the uncertainty zone around the threshold → fallback
      # DECISION_FALLBACK: "true"           # true — switch to the generative slot; false — the job waits (№39)
      # DECISION_MAX_QUESTIONS: "64"        # questions asked in one call (model limit, 1..64)
      # DECISION_MAX_LABELS: "40"           # choice labels ceiling (≥2; more → fallback, reason unsupported)
      # --- editable prompts (Phase 11): the directory is mounted at
      #     ./prompts:/app/prompts; with PROMPTS_DIR set, 3 files
      #     (summary_system, summary_merge_system, judge_system) are created
      #     if missing; existing files are NOT overwritten; an empty file
      #     falls back to the built-in default; judge_system must contain
      #     judge verdict markers (otherwise fatal startup error) ---
      PROMPTS_DIR: "/app/prompts"
      # --- chunked indexing (Phase 7): note vectors are per-chunk ---
      TEXT_SPLITTER: "tiktoken"              # token splitter; encoding fixed: cl100k_base (cache baked into the image)
      CHUNK_SIZE: "1024"                     # chunk window, tokens; change → re-chunk all notes
      CHUNK_OVERLAP: "180"                   # overlap of adjacent windows, tokens (< CHUNK_SIZE)
      CHUNK_MIN_TARGET: "200"                # tail chunk shorter — merge with the previous one
      EMBEDDING_BATCH_SIZE: "32"             # chunks per worker /api/embed request
      EMBEDDING_CONCURRENT_REQUESTS: "1"     # server = one generation at a time; ollama_slot queue enforces this in code as well
      SCORE_THRESHOLD: "0.50"                # cosine cutoff for search (calibrated for qwen3-embedding:8b — recalibrate after switching)
      # --- related notes, level 0 (lsb-0010): lazy graph over note vectors ---
      LINK_TOP: "3"                          # related-notes ceiling per note (FR-1.1)
      LINK_LAZY_THRESHOLD: "0.50"            # lazy-graph cosine cutoff (default = SCORE_THRESHOLD)
      LINK_POOL: "20"                        # KNN candidate pool for related notes
      LINK_COSINE_THRESHOLD: "0.70"           # level-1 cosine link cutoff (FR-2.3)
      LINK_ENTITIES_MIN_COMMON: "2"           # shared significant words for an entities link
      LINK_ENTITIES_MIN_WORD_CHARS: "5"       # minimal significant word length (entities rule)
      # --- background jobs (lsb-0014): links recompute job (lsb-0010-03) ---
      JOB_LINKS_ENABLED: "true"        # links recompute job on/off (its queue stays visible in /health)
      JOB_LINKS_INTERVAL_SEC: "300"    # start pause between links runs in seconds (≥30)
      JOB_LINKS_BATCH: "100"           # notes recomputed per links run (≥1)
      # --- background jobs (lsb-0014): default sweep job (lsb-0011-01) ---
      JOB_NODES_ENABLED: "true"        # default sweep job on/off (its queue stays visible in /health)
      JOB_NODES_INTERVAL_SEC: "3600"   # start pause between nodes runs in seconds (≥30)
      JOB_NODES_BATCH: "20"            # default notes processed per nodes run (≥1)
      JOB_NODES_CLASSIFIER_BUDGET: "10"  # classifier calls per nodes run (≥1, ≤ JOB_NODES_BATCH)
      # --- background jobs (lsb-0014): warnings job (№12) ---
      JOB_WARNINGS_ENABLED: "true"     # misplaced-note warnings job on/off (its queue stays visible in /health)
      JOB_WARNINGS_INTERVAL_SEC: "3600"  # start pause between warnings runs in seconds (≥30)
      JOB_WARNINGS_BATCH: "20"         # placed notes checked per warnings run (≥1)
      JOB_WARNINGS_CLASSIFIER_BUDGET: "10"  # classifier calls per warnings run (≥1, ≤ JOB_WARNINGS_BATCH)
      WARNINGS_MIN_CONFIDENCE: "0.80"  # confidence threshold for "note is misplaced" (0..1)
      WARNINGS_LEVEL_STRICT: "false"   # treat a parent/child node mismatch as a warning too
      # --- background jobs (lsb-0014): terms-normalize job (№32) ---
      JOB_TERMS_ENABLED: "true"       # terms-normalize job on/off (also gated by AREA_TERMS_ENABLED)
      JOB_TERMS_INTERVAL_SEC: "1800"  # start pause between terms-normalize runs in seconds (≥30)
      JOB_TERMS_BATCH: "50"           # term groups processed per terms-normalize run (≥1)
      JOB_TERMS_CLUSTER_SIMILARITY: "0.75"  # context clustering threshold, single-linkage (0..1)
      JOB_TERMS_CONTEXTS_EXCESS: "5"  # contexts-per-term excess warning threshold (≥2)
      # --- node hint on save without namespace (№28): map read, no model call ---
      MEMORY_NODE_HINT_ENABLED: "true"     # node hint on save without namespace (its absence hides the field)
      MEMORY_NODE_HINT_MIN_SCORE: "2.0"    # node selection threshold (2.0 = one matching significant word)
      MEMORY_NODE_HINT_MAX_NODES: "2"      # how many nodes at most in the hint (1..2)
      MEMORY_NODE_HINT_TEXT_CHARS: "200"   # text characters compared alongside the title (≥1)
      # --- "similar" hint on save (№30): FTS candidates + Dice, no model call ---
      MEMORY_SIMILAR_ENABLED: "true"       # similar hint on save (its absence hides the field)
      MEMORY_SIMILAR_LIMIT: "2"            # how many similar notes at most in the reply (1..3)
      MEMORY_SIMILAR_POOL: "5"             # FTS candidates fetched before scoring (≥ limit)
      MEMORY_SIMILAR_THRESHOLD: "0.74"     # Dice threshold over significant words (0..1); 0.30 шумел (№30, решение О. 12.10.2026)
      MEMORY_SIMILAR_TEXT_CHARS: "500"     # text characters scored alongside the title (≥1)
      DEDUP_SIMILARITY: "0.92"               # "duplicate" cosine threshold in background dedup (Phase 8)
      DEDUP_CANDIDATE_TOP_N: "3"             # top-N cosine candidates for the dedup judge
      DEDUP_CANDIDATE_SIMILARITY: "0.80"     # lower paraphrase-candidate threshold (≤ DEDUP_SIMILARITY)
      # --- summarization (mode "B") ---
      MAX_SUMMARY_CHARS: "150"               # summary length limit: model summary + fallback (gate 2026-09-19)
      SUMMARY_THINK: "true"                  # keep model reasoning; ollama provider only
      SUMMARY_NUM_PREDICT: "0"               # 0 = as much as fits (auto budget from SUMMARY_CONTEXT_TOKENS); explicit 35000 keeps the old cap
      MERGE_NUM_PREDICT: "0"                 # 0 = as much as fits; explicit 35000 keeps the old merge cap
      SUMMARY_TIMEOUT_SEC: "750"             # 12.5 min margin for merging 35k-char notes; 900 = the back-off/pause ceiling (15 min): a single call must not hold the slot longer than the job cycle is willing to wait
      SUMMARY_CONTEXT_TOKENS: "0"            # the model's context window; 0 = unknown → previous per-operation caps
      SLOT_PROMPT_RESERVE_TOKENS: "512"      # prompt-chat-template + tokenizer-drift reserve for the auto budget
      SLOT_MAX_OUTPUT_TOKENS: "32768"        # defensive ceiling of the auto output budget (explicit budgets are never clamped)
      SLOT_REASONING_MIN_OUTPUT_TOKENS: "4096"  # below it a reasoning slot gets a startup WARN: too little room for thinking
      SLOT_MIN_TIMEOUT_SEC: "300"            # below it a reasoning slot gets a startup WARN: a long-thinking call looks like a timeout
      # --- HTTP/MCP ---
      PORT: "8080"
      MCP_PATH: "/mcp"
      # --- storage ---
      DB_PATH: "/data/notes.db"
      # 3.4.1: 2000 — одно число на всё: мягкий лимит
      # записи/правки, части merge/split, промпты и цель схемы; расхождение
      # с живым CHECK запускает самомиграцию при старте (вверх — перелив 1:1,
      # вниз — нарезка; design F-22 §4)
      MAX_NOTE_CHARS: "2000"                 # max note length (soft limit = schema target)
      COMMENT_MAX_CHARS: "250"               # no24-01 (3.2.0): max comment length of a note (a remark, not knowledge)
      PENDING_RETRY_SEC: "30"                # background worker start interval (×2 → 15 min)
      # --- slot breaker of the split (3.4.1): во время
      # раскатки нарезка берёт партию заметок, отрабатывает и уступает слот
      # генерации на паузу, затем берёт следующую; очередь однопоточная.
      # Свои числа (НЕ embedding_batch_size/pending_retry_sec — у тех свои
      # смыслы); крутятся override'ом без релиза.
      MIGRATION_BATCH: "5"                   # notes per migration split run (1..100)
      MIGRATION_PAUSE_SEC: "600"             # pause AFTER a run before the next one, sec (0..86400)
      # --- slot breaks (No39, release 3.2.0): pause with a probe + human hint ---
      SLOT_PAUSE_SEC: "900"          # pause of a broken slot = back-off ceiling (≥30); one probe per pause
      SLOT_PAUSE_AFTER: "3"          # consecutive non-transient failures opening the break (≥1; auth opens at once)
      SLOT_HINT_EVERY_SEC: "900"     # throttle of the "tell your human" hint per slot (≥0; 0 — every call)
      SLOT_MAX_ATTEMPTS: "8"         # attempts of one pair before "needs attention" (≥1; the job stays pending)
      SLOT_ATTENTION_RESET_ON_START: "true"  # clear attention_at at startup (slot config may have changed)
      # --- version history (No41, release 3.2.0): record_versions layer ---
      HISTORY_ENABLED: "true"           # kill switch: false — no versions are written, history reads come back empty
      HISTORY_MAX_VERSIONS: "0"         # versions kept per record (0 — keep everything; >0 — prune with re-base)
      HISTORY_RETENTION_DAYS: "0"       # version retention in days (0 — unlimited; >0 — prune with re-base)
      HISTORY_DELTA_INLINE_MAX: "2048"  # threshold "full value ↔ line delta", chars (≥1)
      # --- area flags (No40, release 3.2.0): skills/terms/user-facts surfaces ---
      AREA_SKILLS_ENABLED: "true"       # skills area on/off; its queue stays visible in /health.areas
      AREA_TERMS_ENABLED: "true"        # terms area on/off; its queue stays visible in /health.areas
      AREA_USER_FACTS_ENABLED: "true"   # user-facts area on/off; its queue stays visible in /health.areas
      AREA_LOGS_ENABLED: "true"         # assistant-logs area on/off; its queue stays visible in /health.areas
      LOGS_ACTION_MAX_CHARS: "500"      # assistant-logs form: action limit (>=1), validated by the service
      LOGS_REASON_MAX_CHARS: "500"      # assistant-logs form: reason limit (>=1)
      LOGS_ENTITY_REF_MAX_CHARS: "200"  # assistant-logs form: entity_ref limit (>=1)
      LOGS_OUTCOME_MAX_CHARS: "500"     # assistant-logs form: outcome limit (>=1)
      LOGS_VERIFIED_MAX_CHARS: "200"    # assistant-logs form: verified limit (>=1)
      LOGS_SEARCH_EXCERPT_CHARS: "300"  # action truncation in search/listing output (>=1)
      # --- search ---
      DEFAULT_TOP_K: "5"
      DEFAULT_LIST_LIMIT: "20"
      LIST_MAX_LIMIT_MCP: "20"          # listing ceiling on the MCP surface (lsb-0013)
      LIST_MAX_LIMIT_REST: "50"         # listing ceiling on the REST surface (lsb-0013)
      WARNINGS_MAX_LIMIT_MCP: "20"      # warnings page ceiling on the MCP surface (no12-02, §7.1)
      WARNINGS_MAX_LIMIT_REST: "50"     # warnings page ceiling on the REST surface (no12-02, §7.1)
      RRF_K: "60"
      MAX_QUERY_CHARS: "512"
      MAX_GET_BATCH: "20"
      SNIPPET_CHARS: "120"
      # --- observability/backup ---
      AUTHOR_DEFAULT: "unknown"
      LOG_LEVEL: "INFO"
      BACKUP_DIR: "/data/backups"
      BACKUP_INTERVAL_SEC: "86400"
      BACKUP_KEEP: "7"
      # verify the restore of every Nth snapshot; 0 = manual only (POST /backups/verify)
      BACKUP_VERIFY_EVERY: "1"
      # command to ship a verified snapshot off the box; empty = shipping disabled.
      # Keep the destination and credentials OUTSIDE this repo: mount a config/
      # known_hosts/key via a bind-mount and only reference it from the command here
      # (the service passes just the file path in $LSB_BACKUP_FILE). Example:
      #   rclone --config /srv/ship/rclone.conf copy "$LSB_BACKUP_FILE" remote:lsb-backups/ && echo size=$(stat -c%s "$LSB_BACKUP_FILE")
      BACKUP_SHIP_CMD: ""
      # timeout of the ship command, seconds (>=1)
      BACKUP_SHIP_TIMEOUT_SEC: "300"
      # --- release check (№45): off by default — no verified egress from the
      #     container, so the network cannot be the default source ---
      # UPDATE_CHECK_ENABLED: "false"       # true turns on the background version check
      # UPDATE_SOURCE_FILE: ""             # a JSON file dropped by the host, works without internet
      # UPDATE_CHECK_URL: ""               # optional HTTP source; leave empty to stay offline
      # UPDATE_CHECK_INTERVAL_SEC: "21600"  # background poll period, seconds (≥60)
      # UPDATE_HINT_EVERY_SEC: "86400"      # at most one hint per period, seconds (0 — once per process)
      # UPDATE_HINT_MAX_CHARS: "240"        # hint text limit (1..400)
      # --- namespaces (Phase 10) ---
      NAMESPACE_AUTO_MOVE_MIN_CONFIDENCE: "0.80"  # auto-move of a default note into an existing domain
      NAMESPACE_PROMOTION_THRESHOLD: "15"         # counter of default notes with one subdomain_hint → auto-create a leaf
      NAMESPACE_PROMOTION_MIN_CONFIDENCE: "0.60"  # minimum classification confidence counted by the trigger
      NAMESPACE_SYNONYM_SIMILARITY: "0.85"        # anti-synonym: description cosine — merge instead of create
      NAMESPACE_AUTO_MAX_PER_DAY: "3"             # daily cap of auto-created nodes (storm protection)
      NAMESPACE_MAX_LEAVES_PER_DOMAIN: "12"       # leaf cap per domain root
      NAMESPACE_GROOM_MIN_NOTES: "2"              # a node below this count after moves is a merge candidate
      # NAMESPACE_JUDGE_THINK is unset: the structure judge inherits JUDGE_THINK
      # (thinking). Set "false" for a non-thinking verdict — faster but
      # unstable on borderline candidates in our A/B measurements.
    volumes:
      - ./data:/data  # SQLite notes.db, snapshots
      - ./prompts:/app/prompts  # editable prompts (Phase 11)
    healthcheck:
      # python:3.12-slim has no curl — use plain python (NFR-4: /health without a token).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s