# Тестовая копия llm-second-brain — стабилизация вживую до пуша в GitHub.
# Схема (решение О. 2026-09-03): дистиллят ~/projects → тест-контейнер → GitHub →
# боевой контейнер в ~/docker/llm-second-brain (обновление только по просьбе О.).
#
# Запуск из корня дистиллята:
#   docker compose --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml up -d --build
#   docker compose --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml down
#
# Отличия от боевого: имя llm-second-brain-test, порт 8081:8080, отдельная база
# ./data-test (gitignored), отдельный токен из .env.test (gitignored, НЕ боевой),
# отдельный каталог промптов ./prompts-test (gitignored) — механика промптов
# (Фаза 11, решение №7) тестируется изолированно от боевых файлов.
# Вся остальная конфигурация наследуется из docker-compose.yml (мерж по ключам).
# data-test можно наполнить снапшотом боевой notes.db для реалистичных тестов;
# иначе пустая база создастся при старте. ПЕРЕД первым запуском обязательно
# mkdir data-test prompts-test от своего юзера: docker иначе создаст каталог
# root:root и контейнер (uid 1000) не сможет открыть БД (ловилось 2026-09-03).

# ВАЖНО: name обязателен! Папки дистиллята и боевой копии имеют одинаковый basename
# («llm-second-brain») → без явного name compose считает их одним проектом и
# пересоздаёт БОЕВОЙ контейнер под тестовым конфигом (ловилось 2026-09-03).
name: llm-second-brain-test

services:
  second-brain:
    container_name: llm-second-brain-test
    image: llm-second-brain:test
    ports: !override
      - "8081:8080"
    volumes: !override
      - ./data-test:/data
      - ./prompts-test:/app/prompts
    environment:
      MCP_AUTH_TOKEN: "${TEST_MCP_AUTH_TOKEN:-CHANGE_ME}"
